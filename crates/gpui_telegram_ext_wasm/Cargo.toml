[workspace]

[package]
name = "gpui_telegram_ext_wasm"
version = "1.2.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui_telegram_core = { path = "../gpui_telegram_core", default-features = false }
gpui_telegram_proto = { path = "../gpui_telegram_proto", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = false

[profile.test]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = 0
strip = "debuginfo"
incremental = false
